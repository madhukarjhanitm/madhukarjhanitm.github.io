name: Update LeetCode stats

on:
  schedule:
    - cron: '0 * * * *'   # every 1 hour
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed so the job can commit stats.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch LeetCode stats
        run: node scripts/fetch-leetcode.mjs
        env:
          LEETCODE_USER: MadhukarJha   # <-- change this

      - name: Commit stats.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update LeetCode stats" && git push)
